plugins {
    id 'com.gtnewhorizons.retrofuturagradle' version '1.3.35'
    id 'eclipse'
    id 'idea'
}

version = '1.7.10-1.3.8'
group = 'cyano.lootable'

base {
    archivesName = 'CyanosLootableBodies'
}

minecraft {
    mcVersion = '1.7.10'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft.mcVersion

    filesMatching('mcmod.info') {
        expand(
            version: project.version,
            mcversion: minecraft.mcVersion
        )
    }
}
